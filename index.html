<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Quiz Kinki</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f0;--fg:#2b1030;--card:#ffffff;--acc:#e8246b;--acc2:#ffb703;--ok:#0f9d6b;--ko:#d62839;--line:#e9cfd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0b24;--fg:#ffeef2;--card:#2c1236;--line:#4a2858;--ok:#35d49a;--ko:#ff5d6c}}
:root[data-theme="dark"]{--bg:#1d0b24;--fg:#ffeef2;--card:#2c1236;--line:#4a2858;--ok:#35d49a;--ko:#ff5d6c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:560px;margin:auto}
h1{font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;margin:0 0 14px;font-weight:800;letter-spacing:-.03em}
h1 span{background:var(--acc);color:#fff;padding:0 .18em;display:inline-block;transform:rotate(-2deg)}
h2{font-size:1.35rem;line-height:1.25;margin:10px 0 18px;font-weight:600}
p{line-height:1.5;margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px}
input{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);margin-bottom:14px}
input:focus,button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button{font:inherit;cursor:pointer}
.main{width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:1.05rem}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--bg))}
.opt:disabled{cursor:default}
.meta{display:flex;justify-content:space-between;font-size:.9rem;opacity:.8}
.bar{height:8px;background:var(--line);border-radius:8px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tag{font-size:.85rem;font-weight:600;color:var(--acc)}
.fb{font-weight:800;font-size:1.25rem;margin:6px 0 14px;min-height:1.5em}
.fb.ko{color:var(--ko)}.fb.ok{color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.stats div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:2rem;font-weight:800}
.verdict{font-size:1.8rem;font-weight:800;line-height:1.1;margin:8px 0 6px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<section id="start" class="card">
<h1>El Quiz <span>Kinki</span></h1>
<p>10 preguntas, 3 respuestas, 1 sola correcta. Cada fallo tendrá consecuencias.</p>
<input id="name" placeholder="Tu nombre" maxlength="30" autocomplete="given-name" aria-label="Tu nombre">
<button class="main" id="go">Empezar</button>
</section>

<section id="game" class="card hide">
<div class="meta"><span id="topic" class="tag"></span><span id="count"></span></div>
<div class="bar"><i id="prog"></i></div>
<h2 id="q"></h2>
<div id="opts"></div>
<div id="fb" class="fb" aria-live="polite"></div>
<button class="main hide" id="next">Siguiente</button>
</section>

<section id="end" class="card hide">
<p class="tag" id="who"></p>
<div class="verdict" id="verdict"></div>
<p id="sub"></p>
<div class="stats">
<div><b id="sOk"></b>aciertos</div>
<div><b id="sKo"></b>fallos</div>
<div><b id="sPct"></b>de acierto</div>
</div>
<button class="main" id="again">Jugar otra vez</button>
</section>
</main>
<script>
const QS=[
{t:"Motos eléctricas",q:"¿Qué tipo de motor usan la mayoría de las motos eléctricas modernas?",o:["Motor de explosión de 4 tiempos","Motor sin escobillas (brushless)","Turbina de gas"],a:1},
{t:"Motos eléctricas",q:"¿Qué sistema vigila la carga, la temperatura y la seguridad de las celdas de la batería?",o:["GPS","ABS","BMS"],a:2},
{t:"Motos eléctricas",q:"¿Qué ventaja tiene un motor eléctrico frente a uno de combustión?",o:["Entrega su par máximo desde el arranque","Necesita cambio de aceite cada 5.000 km","Obliga a llevar caja de 6 marchas"],a:0},
{t:"La Isla de las Tentaciones",q:"¿Cómo se llama a los solteros que intentan tentar a las parejas?",o:["Cupidos","Intrusos","Tentadores"],a:2},
{t:"La Isla de las Tentaciones",q:"En las hogueras, ¿qué ven los participantes para saber lo que ha pasado con su pareja?",o:["El guion del programa","Vídeos de lo que ha hecho su pareja","Un test de personalidad"],a:1},
{t:"Disney",q:"¿Cómo se llama el reino donde viven Elsa y Anna en Frozen?",o:["Agrabah","Corona","Arendelle"],a:2},
{t:"Disney",q:"¿Qué estudio de animación creó Toy Story junto a Disney?",o:["DreamWorks","Pixar","Illumination"],a:1},
{t:"Reclutamiento de personal",q:"¿Qué es un «headhunter»?",o:["Un tipo de contrato indefinido","Un profesional que capta candidatos para puestos concretos","Un software de nóminas"],a:1},
{t:"Reclutamiento de personal",q:"¿Qué es el «onboarding»?",o:["El proceso de despido","La entrevista de selección","La integración de un nuevo empleado"],a:2},
{t:"Curiosidad",q:"¿Cuál es el único mamífero capaz de volar de verdad?",o:["Ardilla voladora","Murciélago","Colugo"],a:1}
];
const $=id=>document.getElementById(id);
let name="",i=0,ok=0,done=false;
function show(id){["start","game","end"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function render(){
 const q=QS[i];done=false;
 $("topic").textContent=q.t;$("count").textContent=(i+1)+" / "+QS.length;
 $("prog").style.width=(i/QS.length*100)+"%";
 $("q").textContent=q.q;$("fb").textContent="";$("fb").className="fb";
 $("next").classList.add("hide");
 $("next").textContent=i===QS.length-1?"Ver resultados":"Siguiente";
 const box=$("opts");box.innerHTML="";
 q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(k);box.appendChild(b)});
}
function answer(k){
 if(done)return;done=true;
 const q=QS[i],bs=[...document.querySelectorAll(".opt")];
 bs.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add("ok")});
 const fb=$("fb");
 if(k===q.a){ok++;fb.textContent="¡Correcto, "+name+"!";fb.className="fb ok"}
 else{bs[k].classList.add("ko");fb.textContent=name+", eres un kinki 😈";fb.className="fb ko"}
 $("next").classList.remove("hide");$("next").focus();
}
function finish(){
 const ko=QS.length-ok,pct=Math.round(ok/QS.length*100);
 $("who").textContent=name;
 $("sOk").textContent=ok;$("sKo").textContent=ko;$("sPct").textContent=pct+"%";
 let v,s;
 if(pct>80){v="No eres tan kinki";s="Más del 80% de aciertos. Te libras."}
 else if(ko>QS.length*0.2){v="Suspendes: eres una real kinki";s="Has fallado más del 20%. Sin remedio."}
 else{v="Justito: ni tan kinki ni real kinki";s="Un 80% exacto. Estás en tierra de nadie."}
 $("verdict").textContent=v;$("sub").textContent=s;show("end");
}
function start(){
 const n=$("name").value.trim();
 if(!n){$("name").focus();$("name").placeholder="Escribe tu nombre para jugar";return}
 name=n;i=0;ok=0;show("game");render();
}
$("go").onclick=start;
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
$("next").onclick=()=>{i++;i<QS.length?render():finish()};
$("again").onclick=()=>{show("start");$("name").focus()};
</script>
</body>
</html>
